name: Syntax Check

on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Syntax of Shell Scripts
        run: |
          find . -name "*.sh" -print0 | xargs -0 -I {} bash -n "{}"
      - name: Validate SemVer VERSION Format
        run: |
          ver=$(sed -nE 's/^VERSION="([^"]+)"$/\1/p' scripts/tunnelsats.sh | head -n 1)
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer VERSION in scripts/tunnelsats.sh: '$ver' (expected X.Y.Z)" >&2
            exit 1
          fi
          echo "Verified SemVer VERSION=$ver"
      - name: Test UFW Firewall Checks
        run: bash scripts/test_ufw_check.sh
      - name: Test IPv6 Patch Logic
        run: bash scripts/test_ipv6_patch.sh
      - name: Test WireGuard Config Sanitization
        run: bash scripts/test_sanitize_config.sh
      - name: Test Lifecycle & Routing Idempotency
        run: bash scripts/test_lifecycle_idempotency.sh
      - name: Test CLI Contract (non-interactive, JSON, detect)
        run: bash scripts/test_cli_contract.sh
      - name: Test Managed Dataplane (renderers, inventory, kill switch, verify)
        run: bash scripts/test_managed_dataplane.sh
