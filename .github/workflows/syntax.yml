name: Syntax Check

on: [push, pull_request]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Syntax of Shell Scripts
        run: |
          find . -name "*.sh" -print0 | xargs -0 -I {} bash -n "{}"
      - name: Test Umbrel Version Guardrail
        run: bash scripts/test_check_umbrel_version.sh
      - name: Test UFW Firewall Checks
        run: bash scripts/test_ufw_check.sh
      - name: Test IPv6 Patch Logic
        run: bash scripts/test_ipv6_patch.sh
      - name: Test WireGuard Config Sanitization
        run: bash scripts/test_sanitize_config.sh
      - name: Test Lifecycle & Routing Idempotency
        run: bash scripts/test_lifecycle_idempotency.sh
